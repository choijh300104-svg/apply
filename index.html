<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>참석 신청서</title>
<meta property="og:title" content="제 1회 스잡알 고등학교 동창회 - 참석 신청서 💾">
<meta property="og:description" content="2026. 12. 26 (토) PM 6:00 · 칼스버그 비어라운지">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.0/dist/galmuri.css">
<style>
:root{--face:#c0c0c0;--hi:#fff;--lo:#808080;--dk:#000;--navy:#000080;--navy2:#1084d0;--font:"Galmuri11","Galmuri9",monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);font-size:14px;color:#000;min-height:100vh;padding:20px 12px 76px;
 background:
  radial-gradient(ellipse 34% 9% at 18% 10%,#fff 0 50%,transparent 74%),
  radial-gradient(ellipse 30% 8% at 80% 24%,#fff 0 50%,transparent 74%),
  radial-gradient(ellipse 36% 9% at 22% 62%,#fff 0 50%,transparent 74%),
  linear-gradient(#3b8fe6 0%,#6db4f2 55%,#a8d6fb 100%);background-attachment:fixed;-webkit-tap-highlight-color:transparent}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:100;background:repeating-linear-gradient(0deg,rgba(0,0,0,.08) 0 1px,transparent 1px 3px)}
.win{background:var(--face);padding:3px;box-shadow:inset -1px -1px var(--dk),inset 1px 1px var(--hi),inset -2px -2px var(--lo),inset 2px 2px #dfdfdf,4px 4px 0 rgba(0,0,0,.35)}
.title{display:flex;align-items:center;justify-content:space-between;gap:8px;background:linear-gradient(90deg,var(--navy),var(--navy2));color:#fff;padding:3px 4px;font-weight:bold;font-size:12px}
.title>span:first-child{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btns{display:flex;gap:2px}.tbtn{width:22px;height:18px;background:var(--face);color:#000;font-size:11px;line-height:16px;text-align:center;box-shadow:inset -1px -1px var(--dk),inset 1px 1px var(--hi),inset -2px -2px var(--lo)}
.menu{display:flex;gap:14px;padding:3px 8px;font-size:12px}
.sunken{background:#fff;padding:2px;box-shadow:inset 1px 1px var(--lo),inset -1px -1px var(--hi),inset 2px 2px var(--dk)}
.btn{display:inline-block;background:var(--face);color:#000;font-family:var(--font);font-size:14px;padding:10px 18px;min-height:40px;border:0;cursor:pointer;touch-action:manipulation;box-shadow:inset -1px -1px var(--dk),inset 1px 1px var(--hi),inset -2px -2px var(--lo),inset 2px 2px #dfdfdf}
.btn:active{box-shadow:inset 1px 1px var(--dk),inset -1px -1px var(--hi),inset 2px 2px var(--lo)}
.btn:disabled{color:var(--lo);cursor:default}
.main{max-width:480px;margin:0 auto}
.content{padding:16px 14px 18px;background:#fff}
.marquee{overflow:hidden;white-space:nowrap;background:#000080;color:#ff0;font-size:12px;padding:4px 0;margin-bottom:14px}
.marquee span{display:inline-block;padding-left:100%;animation:mq 16s linear infinite}
@keyframes mq{to{transform:translateX(-100%)}}
h1{font-size:20px;line-height:1.4;text-align:center;color:#2f6fe0;margin-bottom:6px}
.sub{text-align:center;font-size:12px;color:#555;line-height:1.6;margin-bottom:16px}
.logo{display:block;margin:0 auto 10px;max-width:180px}
fieldset{border:0;margin-bottom:12px;padding:12px 10px 10px;position:relative;box-shadow:inset 1px 1px var(--lo),1px 1px var(--hi);background:#f4f4f4}
legend{font-size:12px;font-weight:bold;padding:0 4px;background:#fff;color:var(--navy)}
fieldset{margin-top:6px}
label.f{display:block;margin-bottom:10px;font-size:13px}
label.f:last-child{margin-bottom:0}
label.f b{display:block;margin-bottom:4px}
.req{color:#c00}
input[type=text],input[type=tel],input[type=number],select{width:100%;font-family:var(--font);font-size:16px;padding:8px;background:#fff;border:0;border-radius:0;box-shadow:inset 1px 1px var(--lo),inset -1px -1px var(--hi),inset 2px 2px var(--dk);outline:0;min-height:40px}
input:focus,select:focus{background:#ffffe0}
.inline{display:flex;align-items:center;gap:8px}.inline span{white-space:nowrap}
.radios{display:flex;gap:18px;padding:6px 0}
.radios label{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:14px}
input[type=radio],input[type=checkbox]{width:18px;height:18px;accent-color:#000080}
.hint{font-size:11px;color:#666;margin-top:4px;line-height:1.5}
.agree{display:flex;gap:8px;align-items:flex-start;font-size:12px;line-height:1.6;margin:4px 0 14px}
.agree input{margin-top:3px;flex-shrink:0}
.submit{text-align:center}
.submit .btn{width:100%;font-weight:bold}
.hp{position:absolute;left:-9999px;opacity:0}
.err{color:#c00;font-size:12px;text-align:center;min-height:16px;margin-bottom:8px}
/* 완료 팝업 */
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;padding:16px}
.modal.on{display:flex}
.dlg{width:min(92vw,340px)}
.dlg .body{background:var(--face);padding:18px 14px 8px;text-align:center;line-height:1.7}
.dlg .ico{font-size:34px;margin-bottom:6px}
.dlg .frog{width:120px;height:120px;object-fit:contain;display:block;margin:0 auto 6px;image-rendering:auto}
.dlg .row{padding:6px 0 10px;text-align:center}
.bar{height:16px;margin:10px 0;box-shadow:inset 1px 1px var(--lo),inset -1px -1px var(--hi);background:#fff;padding:2px}
.bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,#000080 0 8px,transparent 8px 10px);transition:width .9s steps(10)}
.taskbar{position:fixed;left:0;right:0;bottom:0;z-index:20;height:48px;background:var(--face);display:flex;align-items:center;gap:8px;padding:4px 8px;box-shadow:inset 0 1px var(--hi),0 -1px var(--lo)}
.taskbar .task{flex:1;padding:6px 10px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clock{padding:6px 10px;font-size:12px;box-shadow:inset 1px 1px var(--lo),inset -1px -1px var(--hi)}
</style>
</head>
<body>
<div class="main">
 <div class="win">
  <div class="title"><span>📝 동창회_참석신청서.exe</span><span class="btns"><span class="tbtn">_</span><span class="tbtn">□</span><span class="tbtn">x</span></span></div>
  <div class="menu"><span>파일</span><span>편집</span><span>보기</span><span>도움말</span></div>
  <div class="sunken">
  <form id="f" class="content" novalidate autocomplete="off">
    <div class="marquee"><span>★☆ 제 1회 스잡알 고등학교 동창회 ★☆ 참석 신청서를 작성해주세요 ★☆</span></div>
    <!-- 로고를 쓰려면 img/logo.png 를 같은 폴더에 두고 아래 줄 주석 해제
    <img class="logo" src="img/logo.png" alt="SPORTSJOB ALIO"> -->
    <h1>제 1회<br>스잡알 고등학교 동창회<br>참석 신청서</h1>
    <p class="sub">2026. 12. 26 (토) PM 6:00<br>을지로3가역 근처</p>

    <fieldset><legend>학생 기본정보</legend>
      <label class="f"><b>이름 <span class="req">*</span></b><input type="text" name="name" maxlength="20" required></label>
      <label class="f"><b>연락처 <span class="req">*</span></b><input type="tel" name="phone" inputmode="tel" maxlength="13" placeholder="010-0000-0000" required></label>
      <div class="f"><b style="display:block;margin-bottom:2px;font-size:13px">성별 <span class="req">*</span></b>
        <div class="radios"><label><input type="radio" name="gender" value="남"> 남</label><label><input type="radio" name="gender" value="여"> 여</label></div></div>
      <label class="f"><b>나이 (출생연도) <span class="req">*</span></b>
        <input type="text" name="birth" maxlength="10" placeholder="예) 23(04)"></label>
    </fieldset>

    <fieldset><legend>학교(직장) 정보</legend>
      <label class="f"><b>현재 소속 (직장명) <span class="req">*</span></b><input type="text" name="company" maxlength="40" required></label>
      <label class="f"><b>직무 / 포지션 <span class="req">*</span></b><input type="text" name="position" maxlength="40" placeholder="예) 마케팅, 구단 운영, 트레이너" required></label>
      <label class="f"><b>근무 연차 <span class="req">*</span></b>
        <div class="inline"><input type="text" name="career" inputmode="numeric" maxlength="2"><span>년차</span></div>
        <p class="hint">스포츠산업 총 경력 기준 (1년 미만은 1년차)</p></label>
    </fieldset>

    <fieldset><legend>친한 친구 (선택)</legend>
      <label class="f"><b>같이 신청한 친한 친구</b><input type="text" name="friend" maxlength="40" placeholder="이름을 적어주세요 (여러 명이면 , 로 구분)"></label>
      <p class="hint">※ 같이 오시는 분도 각자 신청서를 작성해야 합니다.</p>
    </fieldset>

    <input class="hp" type="text" name="website" tabindex="-1" autocomplete="off">

    <label class="agree"><input type="checkbox" id="agree"><span>[필수] 행사 운영을 위해 이름·연락처·소속 등 개인정보를 수집·이용하는 데 동의합니다. (행사 종료 후 파기)</span></label>
    <div class="err" id="err"></div>
    <div class="submit"><button type="submit" class="btn" id="send">▶ 참석 신청하기</button></div>
  </form>
  </div>
 </div>
</div>

<div class="modal" id="ok"><div class="win dlg">
  <div class="title"><span>💾 저장.exe</span><span class="btns"><span class="tbtn">x</span></span></div>
  <div class="body" id="okbody"><div class="ico">💾</div><div>신청서를 저장하는 중...</div><div class="bar"><i id="barfill"></i></div></div>
  <div class="row" id="okrow" style="display:none"><button class="btn" id="okbtn">확인</button></div>
</div></div>

<div class="taskbar"><div class="task sunken">📝 동창회_참석신청서.exe</div><div class="clock" id="clock">18:00</div></div>

<script>
// ★ Apps Script 웹앱 URL 을 여기에 붙여넣으세요 (비워두면 테스트 모드: 저장 안 됨)
const ENDPOINT = "https://script.google.com/macros/s/AKfycbyWNg6OvPhi1TrQr7Yj9KasaqsBClE3mj0Jir9w5J_m9sNklQ3apEY6ALr7Ih2dA0_VHA/exec";

const f = document.getElementById('f'), err = document.getElementById('err'), send = document.getElementById('send');
const tick=()=>{const d=new Date();document.getElementById('clock').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};tick();setInterval(tick,30000);

f.career.addEventListener('input',()=>{f.career.value=f.career.value.replace(/\D/g,'')});
f.phone.addEventListener('input',()=>{
  const d=f.phone.value.replace(/\D/g,'').slice(0,11);
  f.phone.value=d.length>7?d.replace(/(\d{3})(\d{4})(\d+)/,'$1-$2-$3'):d.length>3?d.replace(/(\d{3})(\d+)/,'$1-$2'):d;
});

function validate(){
  const v=n=>f[n].value.trim();
  if(!v('name'))return'이름을 입력해주세요.';
  if(!/^01\d-\d{3,4}-\d{4}$/.test(v('phone')))return'연락처를 010-0000-0000 형식으로 입력해주세요.';
  if(!f.gender.value)return'성별을 선택해주세요.';
  if(!v('birth'))return'나이(출생연도)를 입력해주세요. (예: 23(04))';
  if(!v('company'))return'현재 소속(직장명)을 입력해주세요.';
  if(!v('position'))return'직무/포지션을 입력해주세요.';
  if(v('career')===''||+v('career')<1)return'근무 연차를 입력해주세요.';
  if(!document.getElementById('agree').checked)return'개인정보 수집·이용에 동의해주세요.';
  return'';
}

f.addEventListener('submit',async e=>{
  e.preventDefault(); err.textContent='';
  if(f.website.value) return; // 봇 차단
  const m=validate(); if(m){err.textContent='⚠ '+m;return}
  send.disabled=true;
  const modal=document.getElementById('ok'); modal.classList.add('on');
  requestAnimationFrame(()=>document.getElementById('barfill').style.width='100%');
  const data=new URLSearchParams(new FormData(f)); data.delete('website');
  let ok=true;
  try{ if(ENDPOINT) await fetch(ENDPOINT,{method:'POST',mode:'no-cors',body:data}); else await new Promise(r=>setTimeout(r,900)); }
  catch(x){ok=false}
  setTimeout(()=>{
    document.getElementById('okbody').innerHTML = ok
      ? '<img class="frog" src="img/frog.png" alt=""><div><b>신청이 완료되었습니다!</b><br>12월 26일, 동창회에서 만나요!🏫'+(ENDPOINT?'':'<br><small style="color:#c00">(테스트 모드: 저장되지 않음)</small>')+'</div>'
      : '<div class="ico">⛔</div><div><b>전송에 실패했어요.</b><br>잠시 후 다시 시도해주세요.</div>';
    document.getElementById('okrow').style.display='block';
    document.getElementById('okbtn').onclick=()=>{modal.classList.remove('on'); if(ok){f.reset();} send.disabled=false; if(!ok)return;};
  },1000);
});
</script>
</body>
</html>
